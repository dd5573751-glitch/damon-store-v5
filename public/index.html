<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Damon Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#050505;color:#f5f5f5}
:root{--line:#252525;--muted:#9b9b9b;--silver:#d8d8d8;--panel:#0e0e0e}
button,input,textarea{font:inherit}button{cursor:pointer}
.nav{position:sticky;top:0;z-index:5;background:rgba(5,5,5,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 5%;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:1px}.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover}
.navlinks{display:flex;gap:8px;flex-wrap:wrap}.navlinks button,.btn{background:#111;border:1px solid #333;color:#fff;border-radius:10px;padding:10px 13px}
.btn.primary{background:#eee;color:#050505;border-color:#eee}.btn.danger{border-color:#6b2525;color:#ff8c8c}
.wrap{max-width:1180px;margin:auto;padding:28px 5% 70px}.hero{padding:42px 0 28px;display:grid;grid-template-columns:1.4fr .8fr;gap:25px;align-items:center}
h1{font-size:clamp(38px,7vw,76px);line-height:.95;margin:0 0 16px}.silver{background:linear-gradient(90deg,#fff,#777,#fff);-webkit-background-clip:text;color:transparent}
.muted{color:var(--muted)}.card{background:linear-gradient(145deg,#111,#080808);border:1px solid var(--line);border-radius:18px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat b{font-size:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.price{font-size:24px;font-weight:900;margin:15px 0}
input,textarea{width:100%;background:#090909;border:1px solid #333;color:#fff;border-radius:10px;padding:11px;margin:6px 0 10px;outline:none}textarea{min-height:100px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.section{margin-top:30px}.hidden{display:none}.pill{display:inline-block;border:1px solid #333;border-radius:999px;padding:5px 9px;color:#bbb;font-size:12px}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal>div{width:min(430px,100%);background:#0d0d0d;border:1px solid #333;border-radius:18px;padding:20px}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #222;padding:10px;text-align:left;font-size:13px}.key{font-family:monospace;background:#151515;border:1px dashed #555;padding:8px;border-radius:9px;word-break:break-all}
@media(max-width:800px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.nav{align-items:flex-start;gap:10px;flex-direction:column}}

/* V5 UI polish */
body{overflow-x:hidden;background:radial-gradient(circle at 75% 8%,#171717 0,#050505 28%,#030303 70%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:34px 34px}
.hero{position:relative;min-height:430px;overflow:hidden}
.hero-copy{position:relative;z-index:2}
.ninja-stage{position:absolute;right:0;top:5px;width:min(49%,470px);height:420px;pointer-events:none;filter:drop-shadow(0 0 20px rgba(150,180,255,.12))}
.ninja{position:absolute;right:11%;bottom:18px;width:220px;height:330px;animation:ninjaFloat 3.8s ease-in-out infinite}
.ninja .head{position:absolute;left:67px;top:18px;width:86px;height:92px;border-radius:48% 46% 44% 48%;background:linear-gradient(145deg,#171717,#050505);border:2px solid #777;box-shadow:0 0 25px #000}
.ninja .hair{position:absolute;left:45px;top:-6px;width:125px;height:75px;background:#080808;clip-path:polygon(0 45%,18% 4%,34% 31%,46% 0,58% 29%,73% 3%,83% 34%,100% 13%,88% 63%,70% 45%,55% 67%,38% 48%,18% 74%);filter:drop-shadow(0 0 5px #111)}
.ninja .band{position:absolute;left:59px;top:49px;width:103px;height:18px;background:linear-gradient(#cfcfcf,#666);transform:rotate(-4deg);border-radius:4px}
.ninja .eye{position:absolute;left:78px;top:53px;width:16px;height:5px;background:#fff;border-radius:50%;box-shadow:45px 0 #fff,0 0 10px #9fc0ff,45px 0 10px #9fc0ff}
.ninja .neck{position:absolute;left:94px;top:102px;width:35px;height:27px;background:#111;border:1px solid #555}
.ninja .body{position:absolute;left:50px;top:117px;width:125px;height:145px;background:linear-gradient(150deg,#202020,#070707);clip-path:polygon(25% 0,75% 0,100% 28%,82% 100%,18% 100%,0 28%);border:1px solid #777}
.ninja .scarf{position:absolute;left:48px;top:112px;width:145px;height:25px;background:#0a0a0a;border-top:2px solid #aaa;transform:rotate(8deg);opacity:.9}
.ninja .arm{position:absolute;top:137px;width:36px;height:125px;background:linear-gradient(#151515,#050505);border:1px solid #666;border-radius:20px}
.ninja .arm.a{left:25px;transform:rotate(18deg)}.ninja .arm.b{left:165px;transform:rotate(-22deg)}
.ninja .leg{position:absolute;top:242px;width:48px;height:110px;background:#0a0a0a;border:1px solid #666;border-radius:22px}
.ninja .leg.a{left:62px;transform:rotate(7deg)}.ninja .leg.b{left:125px;transform:rotate(-8deg)}
.chakra{position:absolute;inset:18% 8%;border:1px solid rgba(190,210,255,.18);border-radius:50%;animation:pulseRing 2.8s ease-out infinite}
.chakra:after{content:"";position:absolute;inset:18%;border:1px dashed rgba(255,255,255,.18);border-radius:50%;animation:spin 10s linear infinite}
.lightning{position:absolute;right:35%;top:19%;width:4px;height:240px;background:linear-gradient(transparent,#d9e8ff,transparent);transform:rotate(22deg);filter:blur(.2px);animation:flash 1.7s infinite}
.lightning:before,.lightning:after{content:"";position:absolute;left:-20px;width:55px;height:4px;background:#d9e8ff;transform:rotate(-55deg);box-shadow:0 0 14px #b8d2ff}
.lightning:before{top:50px}.lightning:after{top:135px;transform:rotate(50deg)}
@keyframes ninjaFloat{50%{transform:translateY(-12px) rotate(-1deg)}}
@keyframes pulseRing{0%,100%{transform:scale(.92);opacity:.3}50%{transform:scale(1.04);opacity:.75}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flash{0%,82%,100%{opacity:.12}86%{opacity:1}}
@media(max-width:800px){.hero{min-height:560px}.ninja-stage{width:100%;height:330px;top:255px;right:-8%}.ninja{transform:scale(.82);transform-origin:bottom right}.hero-copy{padding-bottom:300px}}
/* Reliable login/register modal interaction */
.modal{touch-action:manipulation}
.modal.hidden{display:none!important}
.modal>div{animation:modalIn .22s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal button{min-height:44px}

.cardTopup{animation:cardGlow 3.5s ease-in-out infinite}
.cardTopup .card{transition:transform .2s ease,box-shadow .2s ease}
.cardTopup .card:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(255,255,255,.08)}
@keyframes cardGlow{0%,100%{box-shadow:0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 34px rgba(180,200,255,.06)}}
</style>

<style id="card-topup-fix">
.card-topup-fix {
  margin-top: 24px;
  padding: 22px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 20px;
  background: rgba(12,12,12,.92);
}
.card-topup-fix h3 {
  margin: 0 0 8px;
  font-size: 22px;
}
.card-topup-fix .card-note {
  color: #aaa;
  margin-bottom: 18px;
}
.card-topup-fix label {
  display: block;
  margin: 12px 0 7px;
  font-weight: 600;
}
.card-topup-fix input,
.card-topup-fix select {
  width: 100%;
  box-sizing: border-box;
  min-height: 50px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.16);
  background: #080808;
  color: #fff;
  font-size: 16px;
  outline: none;
}
.card-topup-fix input:focus,
.card-topup-fix select:focus {
  border-color: #aaa;
}
.card-topup-fix button {
  width: 100%;
  min-height: 52px;
  margin-top: 18px;
  border: 0;
  border-radius: 13px;
  background: #fff;
  color: #000;
  font-size: 17px;
  font-weight: 700;
}
.card-topup-fix button:disabled {
  opacity: .55;
}
#card-msg-fix {
  margin-top: 14px;
  line-height: 1.5;
}
</style>

</head>
<body>
<nav class="nav"><div class="brand"><img src="/logo.png"><span>DAMON STORE</span></div><div class="navlinks" id="nav"></div></nav>
<main class="wrap">



<script id="card-topup-fix-js">
(function(){
  const btn = document.getElementById("card-send-fix");
  const msg = document.getElementById("card-msg-fix");

  if (!btn || !msg) return;

  btn.onclick = async function(){
    const telco = document.getElementById("card-telco-fix").value;
    const amount = Number(document.getElementById("card-amount-fix").value);
    const serial = document.getElementById("card-serial-fix").value.trim();
    const code = document.getElementById("card-code-fix").value.trim();

    if (!serial || !code) {
      msg.textContent = "❌ Vui lòng nhập đầy đủ số seri và mã thẻ.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "⏳ Đang gửi...";

    try {
      const r = await fetch("/api/card-topup", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        credentials: "include",
        body: JSON.stringify({
          telco: telco,
          amount: amount,
          serial: serial,
          code: code
        })
      });

      const data = await r.json().catch(() => ({}));

      if (!r.ok) {
        throw new Error(data.error || "Không thể gửi thẻ");
      }

      document.getElementById("card-serial-fix").value = "";
      document.getElementById("card-code-fix").value = "";

      msg.innerHTML =
        "✅ <b>Gửi thẻ thành công!</b><br>" +
        "⏳ Vui lòng chờ Admin duyệt tối đa <b>5 phút</b>.<br>" +
        "<span id='card-countdown-fix'>05:00</span>";

      let remain = 300;
      clearInterval(window.cardCountdownFix);

      window.cardCountdownFix = setInterval(function(){
        remain--;

        const el = document.getElementById("card-countdown-fix");
        if (!el) {
          clearInterval(window.cardCountdownFix);
          return;
        }

        const m = String(Math.floor(remain / 60)).padStart(2,"0");
        const sec = String(remain % 60).padStart(2,"0");
        el.textContent = m + ":" + sec;

        if (remain <= 0) {
          clearInterval(window.cardCountdownFix);
          el.textContent =
            "Đã hết 5 phút — nếu chưa được duyệt, hãy liên hệ Admin.";
        }
      }, 1000);

    } catch (e) {
      msg.textContent = "❌ " + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "💳 Gửi thẻ";
    }
  };
})();
</script>

</body></html>
